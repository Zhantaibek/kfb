services:
  postgres:
    image: postgres:16-alpine
    container_name: kse-postgres
    environment:
      POSTGRES_USER: kse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      POSTGRES_DB: kse
    # База доступна только с этого компьютера, не из сети.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kse_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kse -d kse"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kse-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://kse:${POSTGRES_PASSWORD}@postgres:5432/kse
      SESSION_SECRET: ${SESSION_SECRET:?Задайте SESSION_SECRET — случайная строка от 32 символов}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD — пароль первого администратора}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      UPLOADS_DIR: /app/uploads
    # API наружу не публикуется: сайт ходит к нему по внутренней сети через прокси Next.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - kse_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_URL: http://api:4000
    container_name: kse-web
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  kse_pgdata:
  kse_uploads:
