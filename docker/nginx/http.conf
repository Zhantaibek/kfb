# HTTP-режим: DOMAIN не задан (локальный запуск) или сертификат ещё не выпущен.
# Проверка Let's Encrypt (/.well-known/acme-challenge/) отвечает и здесь — так выпускается первый сертификат.

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  include /etc/nginx/kse/proxy-site.inc;
}
